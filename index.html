<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>인생한컷: 가을 비밀지도</title>
    <!-- FontAwesome 아이콘 라이브러리 추가 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* 기본 스타일 초기화 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', 'Gowun Batang', 'Noto Sans KR', serif, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #e3d3c4; /* 가을 느낌 배경 */
            background-image: radial-gradient(#d1bfb0 1px, transparent 1px);
            background-size: 20px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #4a382c;
        }

        /* 액자 형태의 비밀지도 전체 프레임 (첨부 이미지 스타일) */
        .secret-map-frame {
            width: 96vw;
            height: 92vh;
            max-width: 1600px;
            background-color: #cd967e; /* 메인 갈색 포인트 */
            border: 8px solid #a36d56;
            border-radius: 24px;
            box-shadow: 0 12px 36px rgba(74, 56, 44, 0.35), inset 0 2px 6px rgba(255,255,255,0.3);
            padding: 10px;
            display: flex;
        }

        /* 내부 앱 컨테이너 */
        .app-container {
            display: flex;
            width: 100%;
            height: 100%;
            border-radius: 16px;
            overflow: hidden;
            background-color: #fcf8f2;
            border: 2px solid #b8826b;
        }

        /* 왼쪽 사이드바 (가을 빈티지 양식) */
        .sidebar {
            width: 380px;
            min-width: 320px;
            height: 100%;
            background-color: #fcf8f2;
            display: flex;
            flex-direction: column;
            border-right: 2px dashed #d1b2a3;
            z-index: 10;
        }

        /* 사이드바 헤더 영역 */
        .sidebar-header {
            padding: 20px 18px 14px 18px;
            background-color: #cd967e;
            color: #ffffff;
        }

        .sidebar-header h1 {
            font-size: 1.25rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
            color: #ffffff;
            text-shadow: 0 1px 3px rgba(0,0,0,0.15);
        }

        /* 가을 느낌 탭 영역 */
        .category-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        .tab-button {
            flex: 1;
            padding: 10px;
            border: 2px solid #a36d56;
            background-color: #f7ede2;
            color: #6e4735;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 0.9rem;
        }

        .tab-button:hover {
            background-color: #ffffff;
        }

        .tab-button.active {
            background-color: #8c533e;
            color: #ffffff;
            border-color: #6e3d2a;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
        }

        /* 키워드 검색 폼 */
        .search-form {
            display: flex;
            gap: 6px;
        }

        .search-input {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid #cbb2a3;
            border-radius: 8px;
            font-size: 0.88rem;
            outline: none;
            background-color: #ffffff;
            color: #4a382c;
        }

        .search-input::placeholder {
            color: #a89285;
        }

        .search-input:focus {
            border-color: #8c533e;
            box-shadow: 0 0 0 2px rgba(140, 83, 62, 0.2);
        }

        .search-button {
            padding: 10px 14px;
            background-color: #8c533e;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            transition: background-color 0.2s;
        }

        .search-button:hover {
            background-color: #6e3d2a;
        }

        /* 상태 알림 메시지 바 */
        .status-bar {
            padding: 9px 16px;
            background-color: #f3e8dc;
            font-size: 0.82rem;
            color: #7a5441;
            border-bottom: 1px solid #e6d3c3;
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 600;
        }

        /* 검색 결과 리스트 영역 */
        .results-container {
            flex: 1;
            overflow-y: auto;
            padding: 6px 0;
        }

        /* 개별 리스트 카드 아이템 */
        .place-item {
            padding: 14px 18px;
            border-bottom: 1px solid #efe3d5;
            cursor: pointer;
            transition: all 0.2s;
        }

        .place-item:hover {
            background-color: #f5eae0;
        }

        .place-item .place-title {
            font-size: 0.98rem;
            font-weight: 700;
            color: #3d2b20;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .place-item .place-tag {
            font-size: 0.72rem;
            background-color: #cd967e;
            color: #ffffff;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: normal;
        }

        .place-item .place-address {
            font-size: 0.82rem;
            color: #6e584b;
            margin-bottom: 2px;
        }

        .place-item .place-desc {
            font-size: 0.78rem;
            color: #8c533e;
            font-style: italic;
            margin-top: 4px;
        }

        /* 결과 없음 안내 */
        .empty-state {
            padding: 40px 20px;
            text-align: center;
            color: #a38c7d;
        }

        .empty-state i {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #cd967e;
            display: block;
        }

        /* 오른쪽 지도 영역 */
        .map-area {
            flex: 1;
            height: 100%;
            position: relative;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        /* 내 위치 재설정 버튼 */
        .location-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            z-index: 5;
            background-color: #fcf8f2;
            border: 2px solid #cd967e;
            border-radius: 50%;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(74, 56, 44, 0.2);
            cursor: pointer;
            transition: all 0.2s;
            color: #8c533e;
            font-size: 1.1rem;
        }

        .location-btn:hover {
            background-color: #ffffff;
            transform: scale(1.08);
        }

        /* 인포윈도우 가을 빈티지 스타일 */
        .custom-infowindow {
            padding: 12px 14px;
            font-size: 0.85rem;
            background: #fcf8f2;
            border-radius: 10px;
            box-shadow: 0 4px 14px rgba(74, 56, 44, 0.25);
            max-width: 240px;
            border: 2px solid #cd967e;
        }

        .custom-infowindow .info-title {
            font-weight: 800;
            font-size: 0.95rem;
            color: #3d2b20;
            margin-bottom: 4px;
        }

        .custom-infowindow .info-address {
            color: #6e584b;
            font-size: 0.78rem;
            line-height: 1.3;
        }

        /* 가을 비밀지도 느낌 마커 */
        .custom-emoji-marker {
            background: #fcf8f2;
            border: 3px solid #8c533e;
            border-radius: 50%;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.15rem;
            box-shadow: 0 4px 8px rgba(0,0,0,0.25);
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .custom-emoji-marker:hover {
            transform: scale(1.25) translateY(-3px);
            border-color: #cd967e;
            z-index: 100;
        }

        /* 현재 위치 빨간 점 마커 */
        .current-location-dot {
            width: 16px;
            height: 16px;
            background-color: #d94136;
            border: 2px solid #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(217, 65, 54, 0.8);
            position: relative;
        }

        .current-location-dot::after {
            content: '';
            position: absolute;
            top: -5px;
            left: -5px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background-color: rgba(217, 65, 54, 0.3);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.8); opacity: 1; }
            100% { transform: scale(2.2); opacity: 0; }
        }

        /* 모바일 대응 */
        @media (max-width: 768px) {
            .secret-map-frame {
                width: 100vw;
                height: 100vh;
                border: none;
                border-radius: 0;
                padding: 0;
            }
            .app-container {
                flex-direction: column-reverse;
                border-radius: 0;
            }
            .sidebar {
                width: 100%;
                height: 50%;
            }
            .map-area {
                height: 50%;
            }
        }
    </style>

    <!-- 카카오 JavaScript SDK 로드 -->
    <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=62b6461ae60ce5c11cf78284ba3124be&autoload=false&libraries=services"></script>
</head>
<body>

    <!-- 액자 형태 비밀지도 외곽 프레임 -->
    <div class="secret-map-frame">
        <div class="app-container">
            <!-- 왼쪽 사이드바 영역 -->
            <div class="sidebar">
                <div class="sidebar-header">
                    <h1><i class="fa-solid fa-map-location-dot"></i> 인생한컷: 가을 비밀지도</h1>
                    
                    <!-- 카테고리 탭 버튼 -->
                    <div class="category-tabs">
                        <button type="button" class="tab-button active" id="btnAttraction" onclick="switchCategoryTab('AT4')">
                            📸 인생샷 명소
                        </button>
                        <button type="button" class="tab-button" id="btnCafe" onclick="switchCategoryTab('CE7')">
                            ☕ 분좋카 (감성카페)
                        </button>
                    </div>

                    <!-- 검색 폼 -->
                    <form class="search-form" id="searchForm" onsubmit="return false;">
                        <input type="text" id="keywordInput" class="search-input" placeholder="어디서 사진을 찍고 싶나요?" />
                        <button type="submit" id="searchBtn" class="search-button">검색</button>
                    </form>
                </div>

                <!-- 상태 표시 바 -->
                <div class="status-bar" id="statusBar">
                    <i class="fa-solid fa-compass"></i> <span id="statusText">서울·경기 엄선 핫플레이스 로딩 중...</span>
                </div>

                <!-- 장소 검색 결과 목록 -->
                <div class="results-container" id="resultsList"></div>
            </div>

            <!-- 오른쪽 지도 영역 -->
            <div class="map-area">
                <div id="map"></div>
                <!-- 내 위치로 이동 버튼 -->
                <button class="location-btn" id="currentLocationBtn" title="내 위치로 이동">
                    <i class="fa-solid fa-crosshairs"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        /* =================================================================
         * 전역 변수 선언
         * ================================================================= */
        let mapObject = null;                   // 카카오 지도 객체
        let placesService = null;               // 장소 검색 서비스 객체
        let searchOverlays = [];                // 마커 오버레이 배열
        let infoWindowObject = null;            // 인포윈도우 객체
        let currentLocationOverlay = null;     // 현재 위치 오버레이
        let currentCategoryCode = 'AT4';        // 현재 카테고리 (AT4: 관광명소, CE7: 카페)

        // 서울/경기 전체 중심 좌표 (수원-서울 중간 지점 부근)
        const centerLatitude = 37.5100;
        const centerLongitude = 126.9800;
        let currentUserLatitude = centerLatitude;
        let currentUserLongitude = centerLongitude;

        /* =================================================================
         * 서울 / 경기도 SNS 인생샷 명소 및 분위기 좋은 카페(분좋카) 고정 큐레이션 데이터
         * (메가커피 등 일반 매장 제외, 리뷰 검증된 핫플)
         * ================================================================= */
        const curatedPlacesData = {
            AT4: [
                { place_name: "용산공원 미군기지 부분개방부지", address_name: "서울 용산구 서빙고로 221", y: 37.5238, x: 126.9868, desc: "이국적인 빨간 벽돌 스팟! SNS 필수 코스" },
                { place_name: "은평한옥마을", address_name: "서울 은평구 진관동 193-14", y: 37.6433, x: 126.9379, desc: "북한산 아래 멋진 한옥 뷰 인생샷" },
                { place_name: "올림픽공원 나홀로나무", address_name: "서울 송파구 올림픽로 424", y: 37.5202, x: 127.1214, desc: "넓은 들판 위 감성 사진의 성지" },
                { place_name: "성수동 연무장길 스팟", address_name: "서울 성동구 연무장길 35", y: 37.5442, x: 127.0527, desc: "트렌디한 팝업스토어와 빈티지 거리" },
                { place_name: "시흥 갯골생태공원", address_name: "경기 시흥시 동서로 287", y: 37.3916, x: 126.7901, desc: "가을 억새와 흔들전망대 감성 스팟" },
                { place_name: "파주 벽초지수목원", address_name: "경기 파주시 광탄면 부흥로 242", y: 37.8187, x: 126.8504, desc: "드라마 촬영지로 유명한 유럽풍 정원" },
                { place_name: "수원화성 방화수류정", address_name: "경기 수원시 팔달구 정조로880번길 11", y: 37.2885, x: 127.0163, desc: "연못 피크닉과 신선놀음 야경 명소" },
                { place_name: "남양주 물의정원", address_name: "경기 남양주시 조안면 북한강로 398", y: 37.5614, x: 127.3276, desc: "북한강 변에 누운 나무 인생샷" }
            ],
            CE7: [
                { place_name: "카페 앤트러사이트 서교점", address_name: "서울 마포구 월드컵로12길 11", y: 37.5548, x: 126.9118, desc: "조용하고 고즈넉한 정원 뷰 분좋카" },
                { place_name: "성수 쎈느 (Scene)", address_name: "서울 성동구 아차산로5길 33", y: 37.5435, x: 127.0560, desc: "하얀 건물 전면이 포토존인 성수 핫플" },
                { place_name: "청수당 익선", address_name: "서울 종로구 돈화문로11나길 31-9", y: 37.5746, x: 126.9902, desc: "대나무숲과 등불이 만드는 동양풍 감성" },
                { place_name: "더티트렁크 (파주)", address_name: "경기 파주시 지목로 114", y: 37.7125, x: 126.6917, desc: "웅장한 공장형 컨셉 스케일 분좋카" },
                { place_name: "마이알레 (과천)", address_name: "경기 과천시 삼부골3로 17", y: 37.4475, x: 127.0272, desc: "숲속 온실 정원에서 즐기는 힐링 테라스" },
                { place_name: "아나키아 (의정부)", address_name: "경기 의정부시 잔돌길 22", y: 37.7288, x: 127.0702, desc: "호텔식 리조트 분위기 대형 분좋카" },
                { place_name: "포레스트 아웃팅스 (고양)", address_name: "경기 고양시 일산동구 고풍로 61", y: 37.6534, x: 126.8118, desc: "실내 식물원과 분수가 어우러진 사진 맛집" },
                { place_name: "더클리프 남양주점", address_name: "경기 남양주시 와부읍 경강로 926", y: 37.5812, x: 127.2005, desc: "탁 트인 한강 뷰 노을 감성 스팟" }
            ]
        };

        /* =================================================================
         * 1. 초기화
         * ================================================================= */
        window.onload = function() {
            kakao.maps.load(function() {
                initKakaoMapService();
            });
        };

        function initKakaoMapService() {
            const mapContainer = document.getElementById('map');
            
            // 서울/경기 전체가 시원하게 들여다보이는 지도 확대 레벨 (level 9)
            const mapOptions = {
                center: new kakao.maps.LatLng(centerLatitude, centerLongitude),
                level: 9
            };

            mapObject = new kakao.maps.Map(mapContainer, mapOptions);

            const zoomControl = new kakao.maps.ZoomControl();
            mapObject.addControl(zoomControl, kakao.maps.ControlPosition.RIGHT);

            placesService = new kakao.maps.services.Places();
            infoWindowObject = new kakao.maps.InfoWindow({ zIndex: 2 });

            setupEventListeners();
            fetchUserCurrentLocation();
            
            // 기본 탭 (관광명소) 엄선 데이터 로드
            loadCuratedCategoryPlaces('AT4');
        }

        /* =================================================================
         * 2. 이벤트 리스너 설정
         * ================================================================= */
        function setupEventListeners() {
            const searchForm = document.getElementById('searchForm');
            const currentLocationBtn = document.getElementById('currentLocationBtn');

            searchForm.addEventListener('submit', function(event) {
                event.preventDefault();
                executeCustomKeywordSearch();
            });

            currentLocationBtn.addEventListener('click', function() {
                moveToCurrentLocation();
            });
        }

        /* =================================================================
         * 3. 현재 위치 확인
         * ================================================================= */
        function fetchUserCurrentLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    function(position) {
                        currentUserLatitude = position.coords.latitude;
                        currentUserLongitude = position.coords.longitude;
                        const currentPosition = new kakao.maps.LatLng(currentUserLatitude, currentUserLongitude);
                        displayCurrentLocationDot(currentPosition);
                    },
                    function(error) {
                        console.warn("위치 정보 확인 불가:", error.message);
                    }
                );
            }
        }

        function displayCurrentLocationDot(position) {
            if (currentLocationOverlay) currentLocationOverlay.setMap(null);

            const dotElement = document.createElement('div');
            dotElement.className = 'current-location-dot';

            currentLocationOverlay = new kakao.maps.CustomOverlay({
                position: position,
                content: dotElement,
                zIndex: 1
            });

            currentLocationOverlay.setMap(mapObject);
        }

        function moveToCurrentLocation() {
            if (currentUserLatitude && currentUserLongitude) {
                const currentPosition = new kakao.maps.LatLng(currentUserLatitude, currentUserLongitude);
                mapObject.setCenter(currentPosition);
                mapObject.setLevel(6); // 내 위치 중심으로 확대
            }
        }

        /* =================================================================
         * 4. 탭 전환 및 데이터 표시
         * ================================================================= */
        function switchCategoryTab(categoryCode) {
            currentCategoryCode = categoryCode;

            document.getElementById('btnAttraction').classList.toggle('active', categoryCode === 'AT4');
            document.getElementById('btnCafe').classList.toggle('active', categoryCode === 'CE7');
            document.getElementById('keywordInput').value = '';

            loadCuratedCategoryPlaces(categoryCode);
        }

        /**
         * 서울·경기 엄선 핫플레이스 로드
         */
        function loadCuratedCategoryPlaces(categoryCode) {
            clearSearchMarkers();

            const places = curatedPlacesData[categoryCode] || [];
            const statusText = document.getElementById('statusText');
            
            statusText.innerText = (categoryCode === 'AT4') 
                ? "서울·경기 SNS 인생샷 명소를 찾아냈어요!" 
                : "리뷰 검증된 서울·경기 분좋카 목록입니다!";

            displayPlacesList(places);
            displayCustomEmojiMarkers(places);
        }

        /**
         * 직접 키워드로 장소 검색 실행
         */
        function executeCustomKeywordSearch() {
            const keywordInput = document.getElementById('keywordInput');
            const keyword = keywordInput.value.trim();

            if (!keyword) {
                alert("검색어를 입력해 주세요!");
                keywordInput.focus();
                return;
            }

            clearSearchMarkers();
            document.getElementById('btnAttraction').classList.remove('active');
            document.getElementById('btnCafe').classList.remove('active');

            // 서울/경기 범위 검색
            placesService.keywordSearch(keyword, function(data, status) {
                const statusText = document.getElementById('statusText');
                if (status === kakao.maps.services.Status.OK) {
                    statusText.innerText = `'${keyword}' 검색 결과입니다.`;
                    displayPlacesList(data);
                    displayCustomEmojiMarkers(data);
                } else {
                    statusText.innerText = "검색 결과가 존재하지 않습니다.";
                    renderEmptyState("원하시는 스팟을 찾을 수 없어요 🍂");
                }
            });
        }

        /* =================================================================
         * 5. 오버레이 마커 및 리스트 렌더링
         * ================================================================= */
        function displayCustomEmojiMarkers(places) {
            clearSearchMarkers();
            const markerEmoji = (currentCategoryCode === 'CE7') ? '☕' : '📸';
            const bounds = new kakao.maps.LatLngBounds();

            places.forEach((place) => {
                const placePosition = new kakao.maps.LatLng(place.y, place.x);
                bounds.extend(placePosition);

                const markerElement = document.createElement('div');
                markerElement.className = 'custom-emoji-marker';
                markerElement.innerText = markerEmoji;
                markerElement.title = place.place_name;

                const customOverlay = new kakao.maps.CustomOverlay({
                    position: placePosition,
                    content: markerElement,
                    yAnchor: 0.5,
                    xAnchor: 0.5
                });

                customOverlay.setMap(mapObject);

                markerElement.addEventListener('click', function() {
                    mapObject.panTo(placePosition);
                    showInfoWindowOnMap(placePosition, place, markerEmoji);
                });

                searchOverlays.push(customOverlay);
            });

            if (places.length > 0) {
                mapObject.setBounds(bounds);
            }
        }

        function displayPlacesList(places) {
            const resultsList = document.getElementById('resultsList');
            resultsList.innerHTML = '';

            const markerEmoji = (currentCategoryCode === 'CE7') ? '☕' : '📸';

            places.forEach((place, index) => {
                const placePosition = new kakao.maps.LatLng(place.y, place.x);

                const itemElement = document.createElement('div');
                itemElement.className = 'place-item';

                const descHtml = place.desc 
                    ? `<div class="place-desc">"${place.desc}"</div>` 
                    : '';

                itemElement.innerHTML = `
                    <div class="place-title">
                        ${place.place_name}
                        <span class="place-tag">${markerEmoji}</span>
                    </div>
                    <div class="place-address">${place.address_name || place.road_address_name}</div>
                    ${descHtml}
                `;

                itemElement.addEventListener('click', function() {
                    mapObject.panTo(placePosition);
                    mapObject.setLevel(4);
                    showInfoWindowOnMap(placePosition, place, markerEmoji);
                });

                resultsList.appendChild(itemElement);
            });
        }

        function showInfoWindowOnMap(position, place, emoji) {
            const addressText = place.address_name || place.road_address_name;
            
            const content = `
                <div class="custom-infowindow">
                    <div class="info-title">${emoji} ${place.place_name}</div>
                    <div class="info-address"><i class="fa-solid fa-location-dot" style="color: #cd967e;"></i> ${addressText}</div>
                </div>
            `;
            
            infoWindowObject.setContent(content);
            infoWindowObject.setPosition(position);
            infoWindowObject.open(mapObject);
        }

        function clearSearchMarkers() {
            searchOverlays.forEach(overlay => overlay.setMap(null));
            searchOverlays = [];
            if (infoWindowObject) infoWindowObject.close();
        }

        function renderEmptyState(message) {
            const resultsList = document.getElementById('resultsList');
            resultsList.innerHTML = `
                <div class="empty-state">
                    <i class="fa-solid fa-compass"></i>
                    <p>${message}</p>
                </div>
            `;
        }
    </script>
</body>
</html>
