<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>인생한컷: 인생 사진 지도</title>
    <!-- FontAwesome 아이콘 라이브러리 추가 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* 기본 스타일 초기화 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #fff5f8;
            color: #4a3e3e;
        }

        /* 전체 컨테이너: 좌우 2분할 플렉스 레이아웃 */
        .app-container {
            display: flex;
            width: 100vw;
            height: 100vh;
        }

        /* 왼쪽 사이드바 (헤더 + 탭 + 검색창 + 결과 리스트) */
        .sidebar {
            width: 390px;
            min-width: 320px;
            height: 100%;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            box-shadow: 4px 0 15px rgba(251, 182, 219, 0.2);
            z-index: 10;
        }

        /* 사이드바 헤더 영역 - 딸기우유 핑크 컨셉 */
        .sidebar-header {
            padding: 22px 20px 16px 20px;
            background-color: #fbb6db; /* 연핑크 */
            color: #ffffff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .sidebar-header h1 {
            font-size: 1.35rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 14px;
            text-shadow: 0 1px 2px rgba(0,0,0,0.08);
            color: #ffffff;
        }

        /* 카테고리 탭 영역 */
        .category-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        .tab-button {
            flex: 1;
            padding: 10px 14px;
            border: 2px solid #ffffff;
            background-color: rgba(255, 255, 255, 0.5);
            color: #6d4b5b;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 0.92rem;
            backdrop-filter: blur(4px);
        }

        .tab-button:hover {
            background-color: rgba(255, 255, 255, 0.85);
            transform: translateY(-1px);
        }

        .tab-button.active {
            background-color: #ffffff;
            color: #e2619e;
            border-color: #ffffff;
            box-shadow: 0 4px 10px rgba(180, 75, 125, 0.15);
        }

        /* 키워드 검색 폼 영역 */
        .search-form {
            display: flex;
            gap: 8px;
        }

        .search-input {
            flex: 1;
            padding: 11px 14px;
            border: 2px solid #ffffff;
            border-radius: 12px;
            font-size: 0.9rem;
            outline: none;
            transition: all 0.2s;
            background-color: #ffffff;
            color: #4a3e3e;
        }

        .search-input::placeholder {
            color: #bfa0af;
        }

        .search-input:focus {
            border-color: #f78bbd;
            box-shadow: 0 0 0 3px rgba(251, 182, 219, 0.4);
        }

        .search-button {
            padding: 11px 18px;
            background-color: #e2619e;
            color: #ffffff;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.2s;
            box-shadow: 0 2px 6px rgba(226, 97, 158, 0.3);
        }

        .search-button:hover {
            background-color: #cf4988;
            transform: translateY(-1px);
        }

        /* 상태 알림 메시지 바 */
        .status-bar {
            padding: 10px 16px;
            background-color: #fff0f5;
            font-size: 0.85rem;
            color: #b8628b;
            border-bottom: 1px solid #f8e1ec;
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 500;
        }

        /* 검색 결과 리스트 스크롤 영역 */
        .results-container {
            flex: 1;
            overflow-y: auto;
            padding: 8px 0;
        }

        /* 검색 결과 개별 아이템 */
        .place-item {
            padding: 16px 20px;
            border-bottom: 1px solid #fce8f2;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }

        .place-item:hover {
            background-color: #fff5f9;
        }

        .place-item .place-title {
            font-size: 1.02rem;
            font-weight: 700;
            color: #3d2b33;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .place-item .place-marker-num {
            display: inline-block;
            min-width: 22px;
            height: 22px;
            padding: 0 6px;
            background-color: #fbb6db;
            color: #ffffff;
            font-size: 0.75rem;
            border-radius: 11px;
            text-align: center;
            line-height: 22px;
            font-weight: bold;
        }

        .place-item .place-address {
            font-size: 0.85rem;
            color: #7a636f;
            margin-bottom: 2px;
        }

        .place-item .place-road-address {
            font-size: 0.8rem;
            color: #a8929e;
            margin-bottom: 4px;
        }

        .place-item .place-phone {
            font-size: 0.8rem;
            color: #e2619e;
            font-weight: 600;
        }

        /* 결과 없음 및 초기 상태 안내 */
        .empty-state {
            padding: 50px 20px;
            text-align: center;
            color: #b89ca9;
        }

        .empty-state i {
            font-size: 2.8rem;
            margin-bottom: 14px;
            color: #fbb6db;
            display: block;
        }

        /* 페이지네이션 (번호 선택) */
        .pagination {
            display: flex;
            justify-content: center;
            gap: 6px;
            padding: 12px;
            border-top: 1px solid #fce8f2;
            background-color: #ffffff;
        }

        .pagination a {
            display: inline-block;
            width: 32px;
            height: 32px;
            line-height: 32px;
            text-align: center;
            font-size: 0.88rem;
            color: #8c7280;
            text-decoration: none;
            border-radius: 8px;
            border: 1px solid #fce8f2;
            transition: all 0.2s;
        }

        .pagination a:hover {
            border-color: #fbb6db;
            background-color: #fff5f9;
            color: #e2619e;
        }

        .pagination a.active {
            background-color: #fbb6db;
            color: #ffffff;
            border-color: #fbb6db;
            font-weight: 700;
        }

        /* 오른쪽 지도 영역 */
        .map-area {
            flex: 1;
            height: 100%;
            position: relative;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        /* 내 위치 재설정 버튼 */
        .location-btn {
            position: absolute;
            bottom: 24px;
            right: 24px;
            z-index: 5;
            background-color: #ffffff;
            border: 2px solid #fbb6db;
            border-radius: 50%;
            width: 46px;
            height: 46px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(226, 97, 158, 0.2);
            cursor: pointer;
            transition: all 0.2s;
            color: #e2619e;
            font-size: 1.15rem;
        }

        .location-btn:hover {
            background-color: #fff5f9;
            transform: scale(1.08);
            box-shadow: 0 6px 16px rgba(226, 97, 158, 0.3);
        }

        /* 지도 인포윈도우 Custom 스타일 */
        .custom-infowindow {
            padding: 12px 16px;
            font-size: 0.85rem;
            background: white;
            border-radius: 12px;
            box-shadow: 0 6px 18px rgba(180, 75, 125, 0.18);
            max-width: 250px;
            border: 2px solid #fbb6db;
        }

        .custom-infowindow .info-title {
            font-weight: 800;
            font-size: 0.95rem;
            color: #3d2b33;
            margin-bottom: 5px;
        }

        .custom-infowindow .info-address {
            color: #7a636f;
            font-size: 0.8rem;
            line-height: 1.35;
        }

        /* 동글동글 이쁜 커스텀 오버레이 마커 스타일 */
        .custom-emoji-marker {
            background: #ffffff;
            border: 3px solid #fbb6db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            box-shadow: 0 4px 10px rgba(226, 97, 158, 0.3);
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .custom-emoji-marker:hover {
            transform: scale(1.25) translateY(-3px);
            border-color: #e2619e;
            z-index: 100;
        }

        /* 현재 위치 빨간 점 스타일 오버레이 */
        .current-location-dot {
            width: 18px;
            height: 18px;
            background-color: #ff4757;
            border: 3px solid #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(255, 71, 87, 0.8);
            position: relative;
        }

        .current-location-dot::after {
            content: '';
            position: absolute;
            top: -6px;
            left: -6px;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background-color: rgba(255, 71, 87, 0.35);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(0.8);
                opacity: 1;
            }
            100% {
                transform: scale(2.2);
                opacity: 0;
            }
        }

        /* 모바일 대응 반응형 CSS */
        @media (max-width: 768px) {
            .app-container {
                flex-direction: column-reverse;
            }
            .sidebar {
                width: 100%;
                height: 50%;
            }
            .map-area {
                height: 50%;
            }
        }
    </style>

    <!-- 카카오 JavaScript SDK 로드 -->
    <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=62b6461ae60ce5c11cf78284ba3124be&autoload=false&libraries=services"></script>
</head>
<body>

    <div class="app-container">
        <!-- 왼쪽 사이드바 영역 -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h1><i class="fa-solid fa-camera"></i> 인생한컷: 인생 사진 지도</h1>
                
                <!-- 딸기우유 컨셉 카테고리 탭 버튼 -->
                <div class="category-tabs">
                    <button type="button" class="tab-button active" id="btnAttraction" onclick="switchCategoryTab('AT4')">
                        📸 관광명소
                    </button>
                    <button type="button" class="tab-button" id="btnCafe" onclick="switchCategoryTab('CE7')">
                        ☕ 카페
                    </button>
                </div>

                <!-- 키워드 검색 폼 -->
                <form class="search-form" id="searchForm" onsubmit="return false;">
                    <input type="text" id="keywordInput" class="search-input" placeholder="어디서 사진을 찍고 싶나요?" />
                    <button type="submit" id="searchBtn" class="search-button">검색</button>
                </form>
            </div>

            <!-- 현재 상태 및 안내 문구 -->
            <div class="status-bar" id="statusBar">
                <i class="fa-solid fa-heart"></i> <span id="statusText">현재 위치 정보를 가져오는 중...</span>
            </div>

            <!-- 장소 검색 결과 목록 -->
            <div class="results-container" id="resultsList">
                <div class="empty-state">
                    <i class="fa-solid fa-camera-retro"></i>
                    <p>어디서 사진을 찍고 싶나요?<br>카테고리를 선택해보세요!</p>
                </div>
            </div>

            <!-- 페이지네이션 번호 영역 -->
            <div class="pagination" id="pagination"></div>
        </div>

        <!-- 오른쪽 지도 영역 -->
        <div class="map-area">
            <div id="map"></div>
            <!-- 내 위치로 이동 버튼 -->
            <button class="location-btn" id="currentLocationBtn" title="현재 위치로 이동">
                <i class="fa-solid fa-location-crosshairs"></i>
            </button>
        </div>
    </div>

    <script>
        /* =================================================================
         * 전역 변수 선언 (영문 변수명)
         * ================================================================= */
        let mapObject = null;                   // 카카오 지도 객체
        let placesService = null;               // 장소 검색 서비스 객체
        let searchOverlays = [];                // 커스텀 이모지 마커 오버레이 배열
        let infoWindowObject = null;            // 정보 표시용 인포윈도우 객체
        let currentLocationOverlay = null;     // 현재 위치 빨간 점 오버레이 객체
        let currentCategoryCode = 'AT4';        // 현재 선택된 카테고리 코드 (기본값: AT4 관광명소)

        // 기본 좌표 (위치 권한 거부 시 사용할 카카오 판교 본사 좌표)
        const defaultLatitude = 37.402056;
        const defaultLongitude = 127.108212;
        let currentUserLatitude = defaultLatitude;
        let currentUserLongitude = defaultLongitude;

        /* =================================================================
         * 1. SDK 로딩 및 초기화
         * ================================================================= */
        window.onload = function() {
            kakao.maps.load(function() {
                initKakaoMapService();
            });
        };

        /**
         * 지도 서비스 및 컨트롤 초기화
         */
        function initKakaoMapService() {
            const mapContainer = document.getElementById('map');
            
            const mapOptions = {
                center: new kakao.maps.LatLng(defaultLatitude, defaultLongitude),
                level: 4 // 확대 레벨
            };

            // 지도 생성
            mapObject = new kakao.maps.Map(mapContainer, mapOptions);

            // 지도 컨트롤 추가
            const zoomControl = new kakao.maps.ZoomControl();
            mapObject.addControl(zoomControl, kakao.maps.ControlPosition.RIGHT);

            const mapTypeControl = new kakao.maps.MapTypeControl();
            mapObject.addControl(mapTypeControl, kakao.maps.ControlPosition.TOPRIGHT);

            // 서비스 객체 및 인포윈도우 생성
            placesService = new kakao.maps.services.Places();
            infoWindowObject = new kakao.maps.InfoWindow({ zIndex: 2 });

            setupEventListeners();
            fetchUserCurrentLocation();
        }

        /* =================================================================
         * 2. 이벤트 리스너 설정
         * ================================================================= */
        function setupEventListeners() {
            const searchForm = document.getElementById('searchForm');
            const currentLocationBtn = document.getElementById('currentLocationBtn');

            // 키워드 직접 검색 제출
            searchForm.addEventListener('submit', function(event) {
                event.preventDefault();
                executeKeywordSearch();
            });

            // 현재 위치 이동 버튼 클릭
            currentLocationBtn.addEventListener('click', function() {
                moveToCurrentLocation();
            });
        }

        /* =================================================================
         * 3. 현재 위치 정보 (Geolocation) 및 빨간 점 표출
         * ================================================================= */
        function fetchUserCurrentLocation() {
            const statusText = document.getElementById('statusText');

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    function(position) {
                        currentUserLatitude = position.coords.latitude;
                        currentUserLongitude = position.coords.longitude;

                        const currentPosition = new kakao.maps.LatLng(currentUserLatitude, currentUserLongitude);

                        // 지도 중심 이동 및 현재 위치 빨간 점 마커 표시
                        mapObject.setCenter(currentPosition);
                        displayCurrentLocationDot(currentPosition);

                        statusText.innerText = "현재 위치 주변의 인생 스팟을 가져왔어요!";
                        
                        // 초기 카테고리(관광명소) 검색 실행
                        executeCategorySearch(currentCategoryCode);
                    },
                    function(error) {
                        console.warn("위치 정보 가져오기 실패:", error.message);
                        statusText.innerText = "위치 권한을 불러올 수 없어 기본 위치 주변을 검색합니다.";
                        
                        const defaultPosition = new kakao.maps.LatLng(defaultLatitude, defaultLongitude);
                        mapObject.setCenter(defaultPosition);
                        displayCurrentLocationDot(defaultPosition);

                        executeCategorySearch(currentCategoryCode);
                    }
                );
            } else {
                statusText.innerText = "이 브라우저에서는 위치 서비스를 지원하지 않습니다.";
                executeCategorySearch(currentCategoryCode);
            }
        }

        /**
         * 내 위치에 빨간 점(Custom Overlay) 생성
         */
        function displayCurrentLocationDot(position) {
            if (currentLocationOverlay) {
                currentLocationOverlay.setMap(null);
            }

            const dotElement = document.createElement('div');
            dotElement.className = 'current-location-dot';

            currentLocationOverlay = new kakao.maps.CustomOverlay({
                position: position,
                content: dotElement,
                zIndex: 1
            });

            currentLocationOverlay.setMap(mapObject);
        }

        /**
         * 내 위치로 지도를 부드럽게 이동
         */
        function moveToCurrentLocation() {
            if (currentUserLatitude && currentUserLongitude) {
                const currentPosition = new kakao.maps.LatLng(currentUserLatitude, currentUserLongitude);
                mapObject.panTo(currentPosition);
            }
        }

        /* =================================================================
         * 4. 탭 전환 및 카테고리 검색 기능
         * ================================================================= */
        /**
         * 카테고리 탭 변경 함수
         */
        function switchCategoryTab(categoryCode) {
            currentCategoryCode = categoryCode;

            // 탭 버튼 active 클래스 전환
            document.getElementById('btnAttraction').classList.toggle('active', categoryCode === 'AT4');
            document.getElementById('btnCafe').classList.toggle('active', categoryCode === 'CE7');

            // 입력했던 검색창 초기화
            document.getElementById('keywordInput').value = '';

            // 선택한 카테고리로 위치 기반 검색 실행
            executeCategorySearch(categoryCode);
        }

        /**
         * 카테고리 코드로 주변 장소 검색 (반경 5km)
         */
        function executeCategorySearch(categoryCode) {
            clearSearchMarkers();

            const searchOptions = {
                location: new kakao.maps.LatLng(currentUserLatitude, currentUserLongitude),
                radius: 5000, // 5km 반경 내
                sort: kakao.maps.services.SortBy.DISTANCE
            };

            placesService.categorySearch(categoryCode, handleSearchResults, searchOptions);
        }

        /**
         * 직접 키워드로 장소 검색
         */
        function executeKeywordSearch() {
            const keywordInput = document.getElementById('keywordInput');
            const keyword = keywordInput.value.trim();

            if (!keyword) {
                alert("어디서 사진을 찍고 싶은지 검색어를 입력해 주세요!");
                keywordInput.focus();
                return;
            }

            clearSearchMarkers();
            
            // 탭 버튼 active 해제
            document.getElementById('btnAttraction').classList.remove('active');
            document.getElementById('btnCafe').classList.remove('active');

            const searchOptions = {
                location: new kakao.maps.LatLng(currentUserLatitude, currentUserLongitude)
            };

            placesService.keywordSearch(keyword, handleSearchResults, searchOptions);
        }

        /**
         * 검색 결과 처리 콜백 함수
         */
        function handleSearchResults(data, status, pagination) {
            const statusText = document.getElementById('statusText');

            if (status === kakao.maps.services.Status.OK) {
                displaySearchResultsList(data);
                displayCustomEmojiMarkers(data);
                displayPaginationControls(pagination);

                statusText.innerText = `주변에서 총 ${pagination.totalCount}개의 인생 스팟을 찾았어요!`;
            } else if (status === kakao.maps.services.Status.ZERO_RESULT) {
                renderEmptyState("주변에 검색 결과가 없어요 😢");
                clearSearchMarkers();
                statusText.innerText = "검색 결과가 없습니다.";
            } else if (status === kakao.maps.services.Status.ERROR) {
                renderEmptyState("검색 중 오류가 발생했습니다.");
                clearSearchMarkers();
                statusText.innerText = "검색 중 오류가 발생했습니다.";
            }
        }

        /* =================================================================
         * 5. 마커(탭별 아이콘: 📸 / ☕) 및 결과 목록 표시
         * ================================================================= */
        /**
         * 탭 선택에 맞는 이모지 마커(📸/☕) 생성
         */
        function displayCustomEmojiMarkers(places) {
            clearSearchMarkers();

            // 탭 종류에 따른 마커 아이콘 결정 (관광명소: 📸, 카페: ☕)
            const markerEmoji = (currentCategoryCode === 'CE7') ? '☕' : '📸';

            places.forEach((place, index) => {
                const placePosition = new kakao.maps.LatLng(place.y, place.x);

                // 마커 HTML 요소 생성
                const markerElement = document.createElement('div');
                markerElement.className = 'custom-emoji-marker';
                markerElement.innerText = markerEmoji;
                markerElement.title = place.place_name;

                // 마커 커스텀 오버레이 생성
                const customOverlay = new kakao.maps.CustomOverlay({
                    position: placePosition,
                    content: markerElement,
                    yAnchor: 0.5,
                    xAnchor: 0.5
                });

                customOverlay.setMap(mapObject);

                // 마커 클릭 이벤트
                markerElement.addEventListener('click', function() {
                    mapObject.panTo(placePosition);
                    showInfoWindowOnMap(placePosition, place, markerEmoji);
                });

                searchOverlays.push(customOverlay);
            });
        }

        /**
         * 왼쪽 사이드바 결과 목록 생성
         */
        function displaySearchResultsList(places) {
            const resultsList = document.getElementById('resultsList');
            resultsList.innerHTML = '';

            const bounds = new kakao.maps.LatLngBounds();
            const markerEmoji = (currentCategoryCode === 'CE7') ? '☕' : '📸';

            places.forEach((place, index) => {
                const placePosition = new kakao.maps.LatLng(place.y, place.x);
                bounds.extend(placePosition);

                const itemElement = document.createElement('div');
                itemElement.className = 'place-item';

                const addressHtml = place.road_address_name 
                    ? `<div class="place-address">${place.road_address_name}</div>
                       <div class="place-road-address">(지번) ${place.address_name}</div>`
                    : `<div class="place-address">${place.address_name}</div>`;

                const phoneHtml = place.phone 
                    ? `<div class="place-phone"><i class="fa-solid fa-phone"></i> ${place.phone}</div>` 
                    : '';

                itemElement.innerHTML = `
                    <div class="place-title">
                        <span class="place-marker-num">${index + 1}</span>
                        ${place.place_name}
                    </div>
                    ${addressHtml}
                    ${phoneHtml}
                `;

                // 리스트 아이템 클릭 이벤트
                itemElement.addEventListener('click', function() {
                    mapObject.panTo(placePosition);
                    showInfoWindowOnMap(placePosition, place, markerEmoji);
                });

                resultsList.appendChild(itemElement);
            });

            // 검색 결과 위치들이 모두 보이게 지도 영역 확장
            mapObject.setBounds(bounds);
        }

        /**
         * 지도 상에 장소 이름 및 주소 인포윈도우 표시
         */
        function showInfoWindowOnMap(position, place, emoji) {
            const addressText = place.road_address_name ? place.road_address_name : place.address_name;
            
            const content = `
                <div class="custom-infowindow">
                    <div class="info-title">${emoji} ${place.place_name}</div>
                    <div class="info-address"><i class="fa-solid fa-location-dot" style="color: #e2619e;"></i> ${addressText}</div>
                </div>
            `;
            
            infoWindowObject.setContent(content);
            infoWindowObject.setPosition(position);
            infoWindowObject.open(mapObject);
        }

        /**
         * 기존 마커 및 인포윈도우 제거
         */
        function clearSearchMarkers() {
            searchOverlays.forEach(overlay => overlay.setMap(null));
            searchOverlays = [];

            if (infoWindowObject) {
                infoWindowObject.close();
            }
        }

        /* =================================================================
         * 6. 페이지네이션 및 빈 상태 처리
         * ================================================================= */
        function displayPaginationControls(pagination) {
            const paginationContainer = document.getElementById('pagination');
            paginationContainer.innerHTML = '';

            for (let i = 1; i <= pagination.last; i++) {
                const pageLink = document.createElement('a');
                pageLink.href = "#";
                pageLink.innerText = i;

                if (i === pagination.current) {
                    pageLink.className = 'active';
                } else {
                    pageLink.onclick = (function(page) {
                        return function(e) {
                            e.preventDefault();
                            pagination.gotoPage(page);
                        };
                    })(i);
                }

                paginationContainer.appendChild(pageLink);
            }
        }

        function renderEmptyState(message) {
            const resultsList = document.getElementById('resultsList');
            const paginationContainer = document.getElementById('pagination');
            
            resultsList.innerHTML = `
                <div class="empty-state">
                    <i class="fa-solid fa-heart-crack"></i>
                    <p>${message}</p>
                </div>
            `;
            paginationContainer.innerHTML = '';
        }
    </script>
</body>
</html>
