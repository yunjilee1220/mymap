<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>인생한컷: 인생 사진 지도</title>
    <!-- FontAwesome 아이콘 라이브러리 추가 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* 기본 스타일 초기화 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', 'Gowun Batang', 'Noto Sans KR', serif, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #e3d3c4; /* 가을 느낌 배경 */
            background-image: radial-gradient(#d1bfb0 1px, transparent 1px);
            background-size: 20px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #4a382c;
        }

        /* 액자 형태의 비밀지도 전체 프레임 */
        .secret-map-frame {
            width: 96vw;
            height: 92vh;
            max-width: 1600px;
            background-color: #cd967e; /* 메인 갈색 포인트 */
            border: 8px solid #a36d56;
            border-radius: 24px;
            box-shadow: 0 12px 36px rgba(74, 56, 44, 0.35), inset 0 2px 6px rgba(255,255,255,0.3);
            padding: 10px;
            display: flex;
        }

        /* 내부 앱 컨테이너 */
        .app-container {
            display: flex;
            width: 100%;
            height: 100%;
            border-radius: 16px;
            overflow: hidden;
            background-color: #fcf8f2;
            border: 2px solid #b8826b;
        }

        /* 왼쪽 사이드바 */
        .sidebar {
            width: 380px;
            min-width: 320px;
            height: 100%;
            background-color: #fcf8f2;
            display: flex;
            flex-direction: column;
            border-right: 2px dashed #d1b2a3;
            z-index: 10;
        }

        /* 사이드바 헤더 영역 */
        .sidebar-header {
            padding: 20px 18px 14px 18px;
            background-color: #cd967e;
            color: #ffffff;
        }

        .sidebar-header h1 {
            font-size: 1.25rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
            color: #ffffff;
            text-shadow: 0 1px 3px rgba(0,0,0,0.15);
        }

        /* 가을 느낌 탭 영역 */
        .category-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        .tab-button {
            flex: 1;
            padding: 10px;
            border: 2px solid #a36d56;
            background-color: #f7ede2;
            color: #6e4735;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 0.9rem;
        }

        .tab-button:hover {
            background-color: #ffffff;
        }

        .tab-button.active {
            background-color: #8c533e;
            color: #ffffff;
            border-color: #6e3d2a;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
        }

        /* 키워드 검색 폼 */
        .search-form {
            display: flex;
            gap: 6px;
        }

        .search-input {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid #cbb2a3;
            border-radius: 8px;
            font-size: 0.88rem;
            outline: none;
            background-color: #ffffff;
            color: #4a382c;
        }

        .search-input::placeholder {
            color: #a89285;
        }

        .search-input:focus {
            border-color: #8c533e;
            box-shadow: 0 0 0 2px rgba(140, 83, 62, 0.2);
        }

        .search-button {
            padding: 10px 14px;
            background-color: #8c533e;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            transition: background-color 0.2s;
        }

        .search-button:hover {
            background-color: #6e3d2a;
        }

        /* 상태 알림 메시지 바 */
        .status-bar {
            padding: 9px 16px;
            background-color: #f3e8dc;
            font-size: 0.82rem;
            color: #7a5441;
            border-bottom: 1px solid #e6d3c3;
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 600;
        }

        /* 검색 결과 리스트 영역 */
        .results-container {
            flex: 1;
            overflow-y: auto;
            padding: 6px 0;
        }

        /* 개별 리스트 카드 아이템 */
        .place-item {
            padding: 14px 18px;
            border-bottom: 1px solid #efe3d5;
            cursor: pointer;
            transition: all 0.2s;
        }

        .place-item:hover {
            background-color: #f5eae0;
        }

        .place-item .place-title {
            font-size: 0.98rem;
            font-weight: 700;
            color: #3d2b20;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .place-item .place-tag {
            font-size: 0.72rem;
            background-color: #cd967e;
            color: #ffffff;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: normal;
        }

        .place-item .place-address {
            font-size: 0.82rem;
            color: #6e584b;
            margin-bottom: 2px;
        }

        .place-item .place-desc {
            font-size: 0.78rem;
            color: #8c533e;
            font-style: italic;
            margin-top: 4px;
        }

        /* 결과 없음 안내 */
        .empty-state {
            padding: 40px 20px;
            text-align: center;
            color: #a38c7d;
        }

        .empty-state i {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #cd967e;
            display: block;
        }

        /* 오른쪽 지도 영역 */
        .map-area {
            flex: 1;
            height: 100%;
            position: relative;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        /* 내 위치 재설정 버튼 */
        .location-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            z-index: 5;
            background-color: #fcf8f2;
            border: 2px solid #cd967e;
            border-radius: 50%;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(74, 56, 44, 0.2);
            cursor: pointer;
            transition: all 0.2s;
            color: #8c533e;
            font-size: 1.1rem;
        }

        .location-btn:hover {
            background-color: #ffffff;
            transform: scale(1.08);
        }

        /* 인포윈도우 스타일 */
        .custom-infowindow {
            padding: 12px 14px;
            font-size: 0.85rem;
            background: #fcf8f2;
            border-radius: 10px;
            box-shadow: 0 4px 14px rgba(74, 56, 44, 0.25);
            max-width: 240px;
            border: 2px solid #cd967e;
        }

        .custom-infowindow .info-title {
            font-weight: 800;
            font-size: 0.95rem;
            color: #3d2b20;
            margin-bottom: 4px;
        }

        .custom-infowindow .info-address {
            color: #6e584b;
            font-size: 0.78rem;
            line-height: 1.3;
        }

        /* 가을 비밀지도 마커 */
        .custom-emoji-marker {
            background: #fcf8f2;
            border: 3px solid #8c533e;
            border-radius: 50%;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.15rem;
            box-shadow: 0 4px 8px rgba(0,0,0,0.25);
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .custom-emoji-marker:hover {
            transform: scale(1.25) translateY(-3px);
            border-color: #cd967e;
            z-index: 100;
        }

        /* 현재 위치 빨간 점 마커 */
        .current-location-dot {
            width: 16px;
            height: 16px;
            background-color: #d94136;
            border: 2px solid #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(217, 65, 54, 0.8);
            position: relative;
        }

        .current-location-dot::after {
            content: '';
            position: absolute;
            top: -5px;
            left: -5px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background-color: rgba(217, 65, 54, 0.3);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.8); opacity: 1; }
            100% { transform: scale(2.2); opacity: 0; }
        }

        /* 모바일 대응 */
        @media (max-width: 768px) {
            .secret-map-frame {
                width: 100vw;
                height: 100vh;
                border: none;
                border-radius: 0;
                padding: 0;
            }
            .app-container {
                flex-direction: column-reverse;
                border-radius: 0;
            }
            .sidebar {
                width: 100%;
                height: 50%;
            }
            .map-area {
                height: 50%;
            }
        }
    </style>

    <!-- 카카오 JavaScript SDK 로드 -->
    <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=62b6461ae60ce5c11cf78284ba3124be&autoload=false&libraries=services"></script>
</head>
<body>

    <!-- 비밀지도 프레임 -->
    <div class="secret-map-frame">
        <div class="app-container">
            <!-- 왼쪽 사이드바 -->
            <div class="sidebar">
                <div class="sidebar-header">
                    <h1><i class="fa-solid fa-map-location-dot"></i> 인생한컷: 인생 사진 지도</h1>
                    
                    <!-- 카테고리 탭 버튼 -->
                    <div class="category-tabs">

                    <!-- 검색 폼 -->
                    <form class="search-form" id="searchForm" onsubmit="return false;">
                        <input type="text" id="keywordInput" class="search-input" placeholder="어디서 사진을 찍고 싶나요?" />
                        <button type="submit" id="searchBtn" class="search-button">검색</button>

                    <i class="fa-solid fa-compass"></i> <span id="statusText">전국 8도 핫플레이스 로딩 중...</span>
                </div>

                <!-- 장소 검색 결과 목록 -->
                <div class="results-container" id="resultsList"></div>
            </div>

            <!-- 오른쪽 지도 영역 -->
            <div class="map-area">
                <div id="map"></div>
                <!-- 내 위치로 이동 버튼 -->
                <button class="location-btn" id="currentLocationBtn" title="내 위치로 이동">
                    <i class="fa-solid fa-crosshairs"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        /* =================================================================

        let mapObject = null;                   // 카카오 지도 객체

        /* =================================================================

                { place_name: "시흥 갯골생태공원", address_name: "경기 시흥시 동서로 287", y: 37.3916, x: 126.7901, desc: "가을 억새와 흔들전망대 감성 스팟 [경기]" },
                { place_name: "강릉 아르떼뮤지엄", address_name: "강원 강릉시 난설헌로 131", y: 37.7906, x: 128.9103, desc: "빛과 소리의 환상적인 미디어아트 [강원]" },
                { place_name: "충주 활옥동굴", address_name: "충북 충주시 목벌안길 26", y: 36.9802, x: 127.9892, desc: "동굴 속 투명 카약 동화 스팟 [충북]" },
                { place_name: "태안 청산수목원", address_name: "충남 태안군 남면 연꽃길 70", y: 36.6892, x: 126.3211, desc: "팜파스와 핑크뮬리 가을 사진 맛집 [충남]" },
                { place_name: "전주 한옥마을 경기전", address_name: "전북 전주시 완산구 태조로 44", y: 35.8152, x: 127.1498, desc: "한복 입고 남기는 고풍스러운 스팟 [전북]" },
                { place_name: "순천만습지", address_name: "전남 순천시 순천만길 513-25", y: 34.8872, x: 127.5085, desc: "황금빛 갈대밭과 일출/일몰 명소 [전남]" },
                { place_name: "경주 첨성대 핑크뮬리단지", address_name: "경북 경주시 인왕동 839-1", y: 35.8347, x: 129.2190, desc: "핑크빛 드넓은 유적지 포토존 [경북]" },
                { place_name: "부산 해운대 블루라인파크", address_name: "부산 해운대구 청사포로 116", y: 35.1611, x: 129.1413, desc: "스카이캡슐과 바다 전경 [경남/부산]" },
                { place_name: "제주 비밀의숲", address_name: "제주 제주시 구좌읍 송당리 2170", y: 33.4385, x: 126.7719, desc: "편백나무 숲 민트색 트럭 스팟 [제주]" }
            ],
            CE7: [
                { place_name: "청수당 익선", address_name: "서울 종로구 돈화문로11나길 31-9", y: 37.5746, x: 126.9902, desc: "대나무숲과 등불 동양풍 카페 [서울]" },
                { place_name: "포레스트 아웃팅스", address_name: "경기 고양시 일산동구 고풍로 61", y: 37.6534, x: 126.8118, desc: "식물원 분수 대형 감성 스팟 [경기]" },
                { place_name: "춘천 카페 아틀리에솔", address_name: "강원 춘천시 동면 순환대로 1154-57", y: 37.8921, x: 127.7651, desc: "구봉산 산 꼭대기 오션급 전경 [강원]" },
                { place_name: "단양 카페산", address_name: "충북 단양군 가곡면 두산길 196-86", y: 36.9855, x: 128.3982, desc: "패러글라이딩 하늘 뷰 힐링 스팟 [충북]" },
                { place_name: "공주 엔학고레", address_name: "충남 공주시 반포면 불장골길 256", y: 36.4011, x: 127.2023, desc: "저수지 물멍 야외 테라스 분좋카 [충남]" },
                { place_name: "전주 아중레이크", address_name: "전북 전주시 덕진구 아중호수길 161", y: 35.8231, x: 127.1722, desc: "호수 야경 뷰 감성 카페 [전북]" },
                { place_name: "담양 서플라이", address_name: "전남 담양군 담양읍 객사2길 14", y: 35.3218, x: 126.9841, desc: "창고 개조 웅장한 트렌디 스팟 [전남]" },
                { place_name: "경주 황남아우라", address_name: "경북 경주시 첨성로99번길 25-5", y: 35.8322, x: 129.2115, desc: "황리단길 한옥 야외 중정 포토존 [경북]" },
                { place_name: "부산 영도 피아크", address_name: "부산 영도구 해양로 195", y: 35.0805, x: 129.0683, desc: "잔디광장 탁 트인 파노라마 바다 [부산]" },
                { place_name: "제주 원앤온리", address_name: "제주 서귀포시 안덕면 산방로 141", y: 33.2392, x: 126.3191, desc: "산방산과 절벽 파도가 만드는 극상 뷰 [제주]" }
            ]
        };

        /* =================================================================
         * 1. 초기화
         * ================================================================= */
        window.onload = function() {
            kakao.maps.load(function() {
                initKakaoMapService();
            });
        };

        function initKakaoMapService() {
            const mapContainer = document.getElementById('map');
            
            // 대한민국 한반도 전체가 시원하게 들어오는 지도 레벨 (level 13)
            const mapOptions = {
                center: new kakao.maps.LatLng(koreaCenterLatitude, koreaCenterLongitude),
                level: 13
            };

            mapObject = new kakao.maps.Map(mapContainer, mapOptions);

            const zoomControl = new kakao.maps.ZoomControl();
            mapObject.addControl(zoomControl, kakao.maps.ControlPosition.RIGHT);

            placesService = new kakao.maps.services.Places();
            infoWindowObject = new kakao.maps.InfoWindow({ zIndex: 2 });

            setupEventListeners();
            fetchUserCurrentLocation();
            
            // 기본 탭 (전국 관광명소) 데이터 로드
            loadCuratedCategoryPlaces('AT4');
        }

        /* =================================================================
         * 2. 이벤트 리스너 설정
         * ================================================================= */
        function setupEventListeners() {
            const searchForm = document.getElementById('searchForm');
            const currentLocationBtn = document.getElementById('currentLocationBtn');

            searchForm.addEventListener('submit', function(event) {
                event.preventDefault();
                executeCustomKeywordSearch();
            });

            currentLocationBtn.addEventListener('click', function() {
                moveToCurrentLocation();
            });
        }

        /* =================================================================
         * 3. 현재 위치 확인
         * ================================================================= */
        function fetchUserCurrentLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    function(position) {
                        currentUserLatitude = position.coords.latitude;
                        currentUserLongitude = position.coords.longitude;
                        const currentPosition = new kakao.maps.LatLng(currentUserLatitude, currentUserLongitude);
                        displayCurrentLocationDot(currentPosition);
                    },
                    function(error) {
                        console.warn("위치 정보 확인 불가:", error.message);
                    }
                );
            }
        }

        function displayCurrentLocationDot(position) {
            if (currentLocationOverlay) currentLocationOverlay.setMap(null);

            const dotElement = document.createElement('div');
            dotElement.className = 'current-location-dot';

            currentLocationOverlay = new kakao.maps.CustomOverlay({
                position: position,
                content: dotElement,
                zIndex: 1
            });

            currentLocationOverlay.setMap(mapObject);
        }

        function moveToCurrentLocation() {
            if (currentUserLatitude && currentUserLongitude) {
                const currentPosition = new kakao.maps.LatLng(currentUserLatitude, currentUserLongitude);
                mapObject.setCenter(currentPosition);
                mapObject.setLevel(5); // 내 위치로 확실히 확대
            }
        }

        /* =================================================================
         * 4. 탭 전환 및 데이터 표시
         * ================================================================= */
        function switchCategoryTab(categoryCode) {
            currentCategoryCode = categoryCode;

            document.getElementById('btnAttraction').classList.toggle('active', categoryCode === 'AT4');
            document.getElementById('btnCafe').classList.toggle('active', categoryCode === 'CE7');
            document.getElementById('keywordInput').value = '';

            loadCuratedCategoryPlaces(categoryCode);
        }

        /**
         * 전국 8도 엄선 핫플레이스 로드
         */
        function loadCuratedCategoryPlaces(categoryCode) {
            clearSearchMarkers();

            const places = curatedPlacesData[categoryCode] || [];
            const statusText = document.getElementById('statusText');
            
            statusText.innerText = (categoryCode === 'AT4') 
                ? "대한민국 8도 대표 인생샷 명소들입니다!" 
                : "전국 검증 완료! 분위기 좋은 카페들입니다!";

            displayPlacesList(places);
            displayCustomEmojiMarkers(places);
        }

        /**
         * 직접 키워드로 전국 장소 검색
         */
        function executeCustomKeywordSearch() {
            const keywordInput = document.getElementById('keywordInput');
            const keyword = keywordInput.value.trim();

            if (!keyword) {
                alert("어디서 사진을 찍고 싶은지 검색어를 입력해 주세요!");
                keywordInput.focus();
                return;
            }

            clearSearchMarkers();
            document.getElementById('btnAttraction').classList.remove('active');
            document.getElementById('btnCafe').classList.remove('active');

            // 대한민국 전국 범위 키워드 검색
            placesService.keywordSearch(keyword, function(data, status) {
                const statusText = document.getElementById('statusText');
                if (status === kakao.maps.services.Status.OK) {
                    statusText.innerText = `'${keyword}' 전국 검색 결과입니다.`;
                    displayPlacesList(data);
                    displayCustomEmojiMarkers(data);
                } else {
                    statusText.innerText = "검색 결과가 존재하지 않습니다.";
                    renderEmptyState("원하시는 스팟을 찾을 수 없어요 🍂");
                }
            });
        }

        /* =================================================================
         * 5. 오버레이 마커 및 리스트 렌더링
         * ================================================================= */
        function displayCustomEmojiMarkers(places) {
            clearSearchMarkers();
            const markerEmoji = (currentCategoryCode === 'CE7') ? '☕' : '📸';
            const bounds = new kakao.maps.LatLngBounds();

            places.forEach((place) => {
                const placePosition = new kakao.maps.LatLng(place.y, place.x);
                bounds.extend(placePosition);

                const markerElement = document.createElement('div');
                markerElement.className = 'custom-emoji-marker';
                markerElement.innerText = markerEmoji;
                markerElement.title = place.place_name;

                const customOverlay = new kakao.maps.CustomOverlay({
                    position: placePosition,
                    content: markerElement,
                    yAnchor: 0.5,
                    xAnchor: 0.5
                });

                customOverlay.setMap(mapObject);

                markerElement.addEventListener('click', function() {
                    mapObject.panTo(placePosition);
                    showInfoWindowOnMap(placePosition, place, markerEmoji);
                });

                searchOverlays.push(customOverlay);
            });

            if (places.length > 0) {
                mapObject.setBounds(bounds);
            }
        }

        function displayPlacesList(places) {
            const resultsList = document.getElementById('resultsList');
            resultsList.innerHTML = '';

            const markerEmoji = (currentCategoryCode === 'CE7') ? '☕' : '📸';

            places.forEach((place) => {
                const placePosition = new kakao.maps.LatLng(place.y, place.x);

                const itemElement = document.createElement('div');
                itemElement.className = 'place-item';

                const descHtml = place.desc 
                    ? `<div class="place-desc">"${place.desc}"</div>` 
                    : '';

                itemElement.innerHTML = `
                    <div class="place-title">
                        ${place.place_name}
                        <span class="place-tag">${markerEmoji}</span>
                    </div>
                    <div class="place-address">${place.address_name || place.road_address_name}</div>
                    ${descHtml}
                `;

                itemElement.addEventListener('click', function() {
                    mapObject.panTo(placePosition);
                    mapObject.setLevel(5);
                    showInfoWindowOnMap(placePosition, place, markerEmoji);
                });

                resultsList.appendChild(itemElement);
            });
        }

        function showInfoWindowOnMap(position, place, emoji) {
            const addressText = place.address_name || place.road_address_name;
            
            const content = `
                <div class="custom-infowindow">
                    <div class="info-title">${emoji} ${place.place_name}</div>
                    <div class="info-address"><i class="fa-solid fa-location-dot" style="color: #cd967e;"></i> ${addressText}</div>
                </div>
            `;
            
            infoWindowObject.setContent(content);
            infoWindowObject.setPosition(position);
            infoWindowObject.open(mapObject);
        }

        function clearSearchMarkers() {
            searchOverlays.forEach(overlay => overlay.setMap(null));
            searchOverlays = [];
            if (infoWindowObject) infoWindowObject.close();
        }

        function renderEmptyState(message) {
            const resultsList = document.getElementById('resultsList');
            resultsList.innerHTML = `
                <div class="empty-state">
                    <i class="fa-solid fa-compass"></i>
                    <p>${message}</p>
                </div>
            `;
        }
    </script>
</body>
</html>
