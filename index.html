<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카카오맵 장소 검색 서비스</title>
    <!-- FontAwesome 아이콘 라이브러리 추가 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* 기본 스타일 초기화 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #f8f9fa;
            color: #333;
        }

        /* 전체 컨테이너: 좌우 2분할 플렉스 레이아웃 */
        .app-container {
            display: flex;
            width: 100vw;
            height: 100vh;
        }

        /* 왼쪽 사이드바 (검색창 + 결과 리스트) */
        .sidebar {
            width: 390px;
            min-width: 320px;
            height: 100%;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            box-shadow: 2px 0 10px rgba(0,0,0,0.1);
            z-index: 10;
        }

        /* 사이드바 헤더 영역 */
        .sidebar-header {
            padding: 20px;
            background-color: #ffe812; /* 카카오 대표 노란색 */
            color: #3c1e1e;
        }

        .sidebar-header h1 {
            font-size: 1.3rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
        }

        /* 검색 폼 영역 */
        .search-form {
            display: flex;
            gap: 8px;
        }

        .search-input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s;
        }

        .search-input:focus {
            border-color: #3c1e1e;
            box-shadow: 0 0 0 2px rgba(60, 30, 30, 0.1);
        }

        .search-button {
            padding: 10px 16px;
            background-color: #3c1e1e;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: background-color 0.2s;
        }

        .search-button:hover {
            background-color: #251313;
        }

        /* 상태 알림 메시지 바 */
        .status-bar {
            padding: 8px 16px;
            background-color: #f1f5f9;
            font-size: 0.85rem;
            color: #64748b;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* 검색 결과 리스트 스크롤 영역 */
        .results-container {
            flex: 1;
            overflow-y: auto;
            padding: 10px 0;
        }

        /* 검색 결과 개별 아이템 */
        .place-item {
            padding: 16px 20px;
            border-bottom: 1px solid #f1f5f9;
            cursor: pointer;
            transition: background-color 0.2s;
            position: relative;
        }

        .place-item:hover {
            background-color: #f8fafc;
        }

        .place-item .place-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .place-item .place-marker-num {
            display: inline-block;
            width: 20px;
            height: 20px;
            background-color: #ef4444;
            color: white;
            font-size: 0.75rem;
            border-radius: 50%;
            text-align: center;
            line-height: 20px;
            font-weight: bold;
        }

        .place-item .place-address {
            font-size: 0.85rem;
            color: #475569;
            margin-bottom: 2px;
        }

        .place-item .place-road-address {
            font-size: 0.8rem;
            color: #94a3b8;
            margin-bottom: 4px;
        }

        .place-item .place-phone {
            font-size: 0.8rem;
            color: #16a34a;
            font-weight: 500;
        }

        /* 결과 없음 및 초기 상태 안내 */
        .empty-state {
            padding: 40px 20px;
            text-align: center;
            color: #94a3b8;
        }

        .empty-state i {
            font-size: 2.5rem;
            margin-bottom: 12px;
            display: block;
        }

        /* 페이지네이션 (번호 선택) */
        .pagination {
            display: flex;
            justify-content: center;
            gap: 6px;
            padding: 12px;
            border-top: 1px solid #e2e8f0;
            background-color: #ffffff;
        }

        .pagination a {
            display: inline-block;
            width: 32px;
            height: 32px;
            line-height: 32px;
            text-align: center;
            font-size: 0.9rem;
            color: #475569;
            text-decoration: none;
            border-radius: 6px;
            border: 1px solid #e2e8f0;
            transition: all 0.2s;
        }

        .pagination a:hover {
            border-color: #cbd5e1;
            background-color: #f8fafc;
        }

        .pagination a.active {
            background-color: #3c1e1e;
            color: #ffffff;
            border-color: #3c1e1e;
            font-weight: 600;
        }

        /* 오른쪽 지도 영역 */
        .map-area {
            flex: 1;
            height: 100%;
            position: relative;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        /* 내 위치 재설정 버튼 */
        .location-btn {
            position: absolute;
            bottom: 24px;
            right: 24px;
            z-index: 5;
            background-color: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 50%;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            cursor: pointer;
            transition: all 0.2s;
            color: #333;
            font-size: 1.1rem;
        }

        .location-btn:hover {
            background-color: #f8fafc;
            transform: translateY(-2px);
            box-shadow: 0 6px 8px -1px rgba(0, 0, 0, 0.15);
        }

        /* 지도 인포윈도우Custom 스타일 */
        .custom-infowindow {
            padding: 10px 14px;
            font-size: 0.85rem;
            font-weight: 600;
            color: #1e293b;
            white-space: nowrap;
            background: white;
            border-radius: 6px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
        }

        /* 모바일 대응 반응형 CSS */
        @media (max-width: 768px) {
            .app-container {
                flex-direction: column-reverse;
            }
            .sidebar {
                width: 100%;
                height: 50%;
            }
            .map-area {
                height: 50%;
            }
        }
    </style>

    <!--
      카카오 JavaScript SDK 스크립트 로드
      - appkey: 제공해주신 JS 키
      - autoload=false: 스크립트 로딩 후 kakao.maps.load()를 통해 안전하게 지도를 초기화함 (오류 방지)
      - libraries=services: 장소 검색(Places) 기능을 위한 서비스 라이브러리 포함
    -->
    <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=62b6461ae60ce5c11cf78284ba3124be&autoload=false&libraries=services"></script>
</head>
<body>

    <div class="app-container">
        <!-- 왼쪽 사이드바 영역 -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h1><i class="fa-solid fa-map-location-dot"></i> 장소 검색</h1>
                <form class="search-form" id="searchForm" onsubmit="return false;">
                    <input type="text" id="keywordInput" class="search-input" placeholder="검색할 장소를 입력하세요 (예: 강남역 카페)" />
                    <button type="submit" id="searchBtn" class="search-button">검색</button>
                </form>
            </div>

            <!-- 현재 상태 및 안내 문구 -->
            <div class="status-bar" id="statusBar">
                <i class="fa-solid fa-circle-info"></i> <span id="statusText">현재 위치 정보를 가져오는 중...</span>
            </div>

            <!-- 장소 검색 결과 목록 -->
            <div class="results-container" id="resultsList">
                <div class="empty-state">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <p>검색어를 입력하고 검색 버튼을 눌러주세요.</p>
                </div>
            </div>

            <!-- 페이지네이션 번호 영역 -->
            <div class="pagination" id="pagination"></div>
        </div>

        <!-- 오른쪽 지도 영역 -->
        <div class="map-area">
            <div id="map"></div>
            <!-- 내 위치로 이동 버튼 -->
            <button class="location-btn" id="currentLocationBtn" title="현재 위치로 이동">
                <i class="fa-solid fa-crosshairs"></i>
            </button>
        </div>
    </div>

    <script>
        /* =================================================================
         * 전역 변수 선언 (영문 변수명 사용)
         * ================================================================= */
        let mapObject = null;               // 지도 객체
        let placesService = null;           // 장소 검색 서비스 객체
        let searchMarkers = [];             // 검색 결과 마커 배열
        let infoWindowObject = null;        // 지도 인포윈도우 객체
        let currentLocationMarker = null;   // 현재 위치 마커 객체
        
        // 기본 좌표 (위치 권한 거부 시 사용할 카카오 판교 본사 좌표)
        const defaultLatitude = 37.402056;
        const defaultLongitude = 127.108212;
        let currentUserLatitude = defaultLatitude;
        let currentUserLongitude = defaultLongitude;

        /* =================================================================
         * 1. SDK 안전 로딩 및 초기화 (kakao.maps.load)
         * ================================================================= */
        window.onload = function() {
            // kakao.maps.load()를 호출하여 SDK가 완전히 로드된 후 초기화 코드를 실행
            kakao.maps.load(function() {
                initKakaoMapService();
            });
        };

        /**
         * 서비스 초기화 함수
         */
        function initKakaoMapService() {
            const mapContainer = document.getElementById('map');
            
            // 지도 초기 옵션 설정 (요구조건: 확대 레벨 5)
            const mapOptions = {
                center: new kakao.maps.LatLng(defaultLatitude, defaultLongitude), // 초기 임시 중심
                level: 5 // 지도 확대 레벨 5
            };

            // 지도 객체 생성
            mapObject = new kakao.maps.Map(mapContainer, mapOptions);

            // 지도 컨트롤 추가 (확대/축소 레벨 컨트롤 및 지도 타입 전환 컨트롤)
            const zoomControl = new kakao.maps.ZoomControl();
            mapObject.addControl(zoomControl, kakao.maps.ControlPosition.RIGHT);

            const mapTypeControl = new kakao.maps.MapTypeControl();
            mapObject.addControl(mapTypeControl, kakao.maps.ControlPosition.TOPRIGHT);

            // 장소 검색 서비스 객체 생성
            placesService = new kakao.maps.services.Places();

            // 공유 인포윈도우 객체 생성
            infoWindowObject = new kakao.maps.InfoWindow({ zIndex: 1 });

            // 이벤트 리스너 등록
            setupEventListeners();

            // 사용자 현재 위치 확인 요청
            fetchUserCurrentLocation();
        }

        /* =================================================================
         * 2. 이벤트 리스너 설정
         * ================================================================= */
        function setupEventListeners() {
            const searchForm = document.getElementById('searchForm');
            const currentLocationBtn = document.getElementById('currentLocationBtn');

            // 검색 폼 제출 (엔터키 또는 버튼 클릭)
            searchForm.addEventListener('submit', function(event) {
                event.preventDefault();
                executePlaceSearch();
            });

            // 내 위치로 이동 버튼 클릭
            currentLocationBtn.addEventListener('click', function() {
                moveToCurrentLocation();
            });
        }

        /* =================================================================
         * 3. 현재 위치 정보 획득 (Geolocation API)
         * ================================================================= */
        function fetchUserCurrentLocation() {
            const statusText = document.getElementById('statusText');

            // 브라우저의 Geolocation 지원 여부 확인
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    function(position) {
                        // 위치 권한 허용 성공 시
                        currentUserLatitude = position.coords.latitude;
                        currentUserLongitude = position.coords.longitude;

                        const currentPosition = new kakao.maps.LatLng(currentUserLatitude, currentUserLongitude);

                        // 지도의 중심을 현재 위치로 이동
                        mapObject.setCenter(currentPosition);

                        // 현재 위치 마커 표시
                        displayCurrentLocationMarker(currentPosition);

                        statusText.innerText = "현재 위치를 중심으로 지도가 설정되었습니다.";
                    },
                    function(error) {
                        // 위치 권한 거부 또는 실패 시
                        console.warn("위치 정보 가져오기 실패:", error.message);
                        statusText.innerText = "위치 권한을 불러올 수 없어 기본 위치로 설정되었습니다.";
                        
                        const defaultPosition = new kakao.maps.LatLng(defaultLatitude, defaultLongitude);
                        mapObject.setCenter(defaultPosition);
                    }
                );
            } else {
                statusText.innerText = "이 브라우저에서는 위치 서비스를 지원하지 않습니다.";
            }
        }

        /**
         * 현재 위치 마커 표시 함수
         */
        function displayCurrentLocationMarker(position) {
            if (currentLocationMarker) {
                currentLocationMarker.setMap(null); // 기존 마커 제거
            }

            // 빨간색 원형 느낌의 커스텀 마커 이미지 또는 기본 마커 생성
            currentLocationMarker = new kakao.maps.Marker({
                map: mapObject,
                position: position,
                title: "현재 위치"
            });
        }

        /**
         * 내 위치로 지도를 이동시키는 함수
         */
        function moveToCurrentLocation() {
            if (currentUserLatitude && currentUserLongitude) {
                const currentPosition = new kakao.maps.LatLng(currentUserLatitude, currentUserLongitude);
                mapObject.panTo(currentPosition); // 부드럽게 위치 이동
            }
        }

        /* =================================================================
         * 4. 장소 검색 기능 (kakao.maps.services.Places)
         * ================================================================= */
        function executePlaceSearch() {
            const keywordInput = document.getElementById('keywordInput');
            const keyword = keywordInput.value.trim();

            if (!keyword) {
                alert("검색어를 입력해 주세요!");
                keywordInput.focus();
                return;
            }

            // 키워드로 장소 검색 실행
            placesService.keywordSearch(keyword, handleSearchResults);
        }

        /**
         * 장소 검색 결과 콜백 함수
         */
        function handleSearchResults(data, status, pagination) {
            const statusText = document.getElementById('statusText');

            if (status === kakao.maps.services.Status.OK) {
                // 검색 성공: 검색 목록과 마커 표출
                displaySearchResultsList(data);
                displaySearchResultsMarkers(data);
                displayPaginationControls(pagination);

                statusText.innerText = `검색 결과: 총 ${pagination.totalCount}개의 장소를 찾았습니다.`;
            } else if (status === kakao.maps.services.Status.ZERO_RESULT) {
                renderEmptyState("검색 결과가 존재하지 않습니다.");
                clearSearchMarkers();
                statusText.innerText = "검색 결과가 없습니다.";
            } else if (status === kakao.maps.services.Status.ERROR) {
                renderEmptyState("검색 중 오류가 발생했습니다.");
                clearSearchMarkers();
                statusText.innerText = "검색 중 오류가 발생했습니다.";
            }
        }

        /* =================================================================
         * 5. 검색 결과 및 마커 렌더링
         * ================================================================= */
        /**
         * 왼쪽 결과 리스트 화면 생성
         */
        function displaySearchResultsList(places) {
            const resultsList = document.getElementById('resultsList');
            resultsList.innerHTML = ''; // 기존 리스트 비우기

            const bounds = new kakao.maps.LatLngBounds();

            places.forEach((place, index) => {
                const placePosition = new kakao.maps.LatLng(place.y, place.x);
                bounds.extend(placePosition);

                // 개별 결과 아이템 엘리먼트 생성
                const itemElement = document.createElement('div');
                itemElement.className = 'place-item';

                // 도로명 주소 또는 지번 주소 선택
                const addressHtml = place.road_address_name 
                    ? `<div class="place-address">${place.road_address_name}</div>
                       <div class="place-road-address">(지번) ${place.address_name}</div>`
                    : `<div class="place-address">${place.address_name}</div>`;

                const phoneHtml = place.phone 
                    ? `<div class="place-phone"><i class="fa-solid fa-phone"></i> ${place.phone}</div>` 
                    : '';

                itemElement.innerHTML = `
                    <div class="place-title">
                        <span class="place-marker-num">${index + 1}</span>
                        ${place.place_name}
                    </div>
                    ${addressHtml}
                    ${phoneHtml}
                `;

                // 리스트 항목 마우스 오버 / 클릭 이벤트 처리
                itemElement.addEventListener('click', function() {
                    mapObject.panTo(placePosition);
                    showInfoWindowOnMap(searchMarkers[index], place.place_name);
                });

                resultsList.appendChild(itemElement);
            });

            // 검색된 장소들이 모두 보이도록 지도 영역(경계) 재설정
            mapObject.setBounds(bounds);
        }

        /**
         * 지도 상에 검색 결과 마커 표시
         */
        function displaySearchResultsMarkers(places) {
            // 기존 검색 마커 지우기
            clearSearchMarkers();

            places.forEach((place, index) => {
                const placePosition = new kakao.maps.LatLng(place.y, place.x);

                // 숫자 표기용 기본 마커 생성
                const marker = new kakao.maps.Marker({
                    position: placePosition,
                    map: mapObject
                });

                // 마커 클릭 시 인포윈도우 표시
                kakao.maps.event.addListener(marker, 'click', function() {
                    showInfoWindowOnMap(marker, place.place_name);
                });

                searchMarkers.push(marker);
            });
        }

        /**
         * 지도에 인포윈도우(장소 이름) 표출
         */
        function showInfoWindowOnMap(marker, placeName) {
            const content = `<div class="custom-infowindow">${placeName}</div>`;
            infoWindowObject.setContent(content);
            infoWindowObject.open(mapObject, marker);
        }

        /**
         * 기존 검색 마커 제거 함수
         */
        function clearSearchMarkers() {
            searchMarkers.forEach(marker => marker.setMap(null));
            searchMarkers = [];
            if (infoWindowObject) {
                infoWindowObject.close();
            }
        }

        /* =================================================================
         * 6. 페이지네이션 (번호 표출) 처리
         * ================================================================= */
        function displayPaginationControls(pagination) {
            const paginationContainer = document.getElementById('pagination');
            paginationContainer.innerHTML = '';

            for (let i = 1; i <= pagination.last; i++) {
                const pageLink = document.createElement('a');
                pageLink.href = "#";
                pageLink.innerText = i;

                if (i === pagination.current) {
                    pageLink.className = 'active';
                } else {
                    pageLink.onclick = (function(page) {
                        return function(e) {
                            e.preventDefault();
                            pagination.gotoPage(page);
                        };
                    })(i);
                }

                paginationContainer.appendChild(pageLink);
            }
        }

        /**
         * 결과 없음 상태 표출 함수
         */
        function renderEmptyState(message) {
            const resultsList = document.getElementById('resultsList');
            const paginationContainer = document.getElementById('pagination');
            
            resultsList.innerHTML = `
                <div class="empty-state">
                    <i class="fa-solid fa-circle-exclamation"></i>
                    <p>${message}</p>
                </div>
            `;
            paginationContainer.innerHTML = '';
        }
    </script>
</body>
</html>
